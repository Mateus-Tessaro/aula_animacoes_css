<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efeitos em elementos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Efeitos em elementos</h1>
        <p>Passe o mouse nas caixas</p>

        <section class="container">
            <div class="card">
                <h3>Rotate</h3>
                <div class="quadrado-rotate"></div>
            </div>

            <div class="card">
                <h3>Scale</h3>
                <div class="quadrado-scale"></div>
            </div> 

            <div class="card">
                <h3>Skew</h3>
                <div class="quadrado-skew"></div>
            </div>

            <div class="card">
                <h3>Translate</h3>
                <div class="quadrado-translate"></div>
            </div>  
            
            <div class="card">
                <h3>Rotate 3d</h3>
                <div class="quadrado-rotate3d"></div>
            </div> 

            <div class="card">
                <h3>Perspective</h3>
                <div class="quadrado-perspective"></div>
            </div> 

            <div class="card">
                <h3>Matrix</h3>
                <div class="quadrado-matrix"></div>
            </div>

            <div class="card">
                <h3>Animação</h3>
            <div class="quadrado-animacao"></div>
            </div>
        </section>
    </main>
</body>
</html>
